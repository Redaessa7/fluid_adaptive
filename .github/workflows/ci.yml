name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: Analyze + test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Informational until you run `dart format .` once and commit the result.
      # Then delete `continue-on-error` to enforce it.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Publish dry run
        run: flutter pub publish --dry-run

  min-supported:
    # Proves the lower bounds declared in pubspec.yaml (Flutter 3.16 / Dart 3.2).
    name: Tests (minimum supported Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.0"
          cache: true
      - run: flutter pub get
      - run: flutter test
